x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'academy-genai-secret-key'
    # Weaviate config
    WEAVIATE_HOST: weaviate
    WEAVIATE_PORT: 8081
    WEAVIATE_API_KEY: adminkey
    WEAVIATE_CONN_ID: weaviate_default
    WEAVIATE_CLASS_NAME: AirflowDocs
    WEAVIATE_VECTORIZER: text2vec-openai
    WEAVIATE_SCHEMA_PATH: /usr/local/airflow/include/schema.json
    INGESTION_FOLDERS_LOCAL_PATHS: /usr/local/airflow/include/data
  volumes:
    - ./dags:/usr/local/airflow/dags
    - ./include:/usr/local/airflow/include
    - ./solution:/usr/local/airflow/solution
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - airflow

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    networks:
      - airflow

  webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_started

  scheduler:
    <<: *airflow-common
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        airflow connections add weaviate_default \
          --conn-type weaviate \
          --conn-host weaviate \
          --conn-port 8081 \
          --conn-password adminkey \
          --conn-extra '{"additional_headers": {"X-OpenAI-Api-Key": "${OPENAI_API_KEY}"}}' || true
    depends_on:
      postgres:
        condition: service_healthy

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.0
    command: "--host 0.0.0.0 --port '8081' --scheme http"
    ports:
      - "8081:8081"
      - "50051:50051"
    volumes:
      - ./include/weaviate/backup:/var/lib/weaviate/backup
      - weaviate-data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: 'readonlykey,adminkey'
      AUTHENTICATION_APIKEY_USERS: 'jane@doe.com,john@doe.com'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai, backup-filesystem, qna-openai, text2vec'
      BACKUP_FILESYSTEM_PATH: '/var/lib/weaviate/backup'
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - airflow

  streamlit:
    image: python:3.11
    command: bash -c "pip install -r /app/include/requirements.txt && streamlit run --server.enableWebsocketCompression=false --server.enableCORS=false --server.enableXsrfProtection=false /app/include/app.py"
    ports:
      - "8501:8501"
    volumes:
      - ./include/streamlit:/app/include
      - ./include/model_results:/app/include/model_results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEAVIATE_CLASS_NAME: AirflowDocs
    env_file:
      - .env
    networks:
      - airflow

networks:
  airflow:
    driver: bridge

volumes:
  postgres-db-volume:
  weaviate-data:

